name: Build APK for Samsung Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Generate Upload Key & Build Signed Release APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          keytool -genkey -v -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass android -keypass android -dname "CN=RabbitAI, OU=Dev, O=Rabbit, L=Alexandria, S=Alexandria, C=EG"
          gradle assembleRelease

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: RabbitAI-SamsungStore-APK
          path: app/build/outputs/apk/release/*.apk
