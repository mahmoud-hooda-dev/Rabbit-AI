name: Build APK for Samsung Store

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses & Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Found project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleRelease

      - name: Generate Signing Key
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rabbit -storepass rabbit123 -keypass rabbit123 -dname "CN=RabbitAI, OU=Dev, O=Rabbit, L=Alexandria, S=Alexandria, C=EG"

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKey: release.jks
          alias: rabbit
          keyStorePassword: rabbit123
          keyPassword: rabbit123

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: RabbitAI-SamsungStore-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
